name: deploy
on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: 테스트 (실패하면 배포하지 않는다)
        run: dotnet test --solution Viva.Chat.slnx -c Release

      - name: Pack
        run: |
          dotnet pack Viva.Chat.slnx -c Release -o out -p:Version=${GITHUB_REF_NAME#v}
          ls -l out

      - name: NuGet 임시 API 키 발급 (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: KimBurmJun

      - name: NuGet Push (Contracts, Chat, AiChat)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IDS="ViVaKR.Chat.Contracts ViVaKR.Chat ViVaKR.AiChat"

          for ID in $IDS; do
            test -f "out/$ID.$VERSION.nupkg" || { echo "::error::out/$ID.$VERSION.nupkg 가 없습니다"; exit 1; }
          done

          for ID in $IDS; do
            dotnet nuget push "out/$ID.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
          done
