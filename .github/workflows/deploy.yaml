name: deploy
on:
  push:
    # 숫자로 시작하는 v 태그만 받는다 (오타로 vtest 같은 태그를 달아도 배포되지 않게)
    tags:
      - 'v[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. .NET 환경 세팅
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. 테스트 (실패하면 여기서 멈추고 배포하지 않는다)
        run: dotnet test Viva.Chat.slnx -c Release

      - name: 4. 패키지 빌드 및 압축 (Pack)
        run: |
          dotnet pack Viva.Chat.slnx -c Release -o out -p:Version=${GITHUB_REF_NAME#v}
          ls -l out

      - name: 5. NuGet 임시 API 키 발급 (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: KimBurmJun

      - name: 6. NuGet Push (Contracts 먼저)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for ID in ViVaKR.Chat.Contracts ViVaKR.Chat; do
            dotnet nuget push "out/$ID.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
          done
